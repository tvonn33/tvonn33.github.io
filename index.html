   The app, the data and the logins all live on that server; nothing else is stored in this repository.
   While it loads: the shield's two sides open inward like doors and the W flies off into the distance (Thomas, 2026-11-17). */
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbxUyS4z_Q2362NvduPf-RM2RfoyS0f8AtL_WJxWv69Dj7ISU9EX20sceVLxL-raGEXT/exec';
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage'), L = $('doorL'), R = $('doorR'), W = $('w'), G = $('glow'), msg = $('msg');
  var page = null, shown = false;
  var still = !stage.animate || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function anim(el, frames, o) { return el.animate(frames, Object.assign({ fill: 'forwards' }, o)).finished.catch(function () {}); }
  var EASE_DOOR = 'cubic-bezier(.62,0,.28,1)';
  function openUp(delay) {
    return Promise.all([
      anim(L, [{ transform: 'rotateY(0deg)', filter: 'brightness(1)' }, { transform: 'rotateY(78deg)', filter: 'brightness(.55)' }], { duration: 900, delay: delay, easing: EASE_DOOR }),
      anim(R, [{ transform: 'rotateY(0deg)', filter: 'brightness(1)' }, { transform: 'rotateY(-78deg)', filter: 'brightness(.55)' }], { duration: 900, delay: delay, easing: EASE_DOOR }),
      anim(G, [{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'scale(1)', offset: .45 }, { opacity: 0, transform: 'scale(1.25)' }], { duration: 1500, delay: delay + 150, easing: 'ease-out' }),
      anim(W, [{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(1.06)', opacity: 1, offset: .12 }, { transform: 'scale(.015)', opacity: 0 }], { duration: 1250, delay: delay + 280, easing: 'cubic-bezier(.5,0,.8,.25)' })
    ]);
  }
  function closeBack() {
    return Promise.all([
      anim(L, [{ transform: 'rotateY(78deg)', filter: 'brightness(.55)' }, { transform: 'rotateY(0deg)', filter: 'brightness(1)' }], { duration: 600, easing: EASE_DOOR }),
      anim(R, [{ transform: 'rotateY(-78deg)', filter: 'brightness(.55)' }, { transform: 'rotateY(0deg)', filter: 'brightness(1)' }], { duration: 600, easing: EASE_DOOR }),
      anim(W, [{ transform: 'scale(.55)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: 500, delay: 250, easing: 'ease-out' })
    ]);
  }
  function show() {
    if (shown || page === null) return;
    shown = true;
    var go = function () { window.__WMR_API = API; document.open(); document.write(page); document.close(); };
    if (still) return go();
    anim(stage, [{ opacity: 1 }, { opacity: 0 }], { duration: 180, easing: 'ease-in' }).then(go);
  }
  async function play() {
    if (still) { stage.style.opacity = 1; return; }
    anim(stage, [{ opacity: 0, transform: 'scale(.9)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 450, easing: 'cubic-bezier(.2,.7,.2,1)' });
    await openUp(520);                       // first time: show the shield, then open
    while (page === null) {                  // still loading: close, then open again
      msg.className = 'on';
      await sleep(200); if (page !== null) break;
      await closeBack(); if (page !== null) break;
      await openUp(250);
    }
    show();
  }
  function load() {
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'sitePage', args: [] }) })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) {
        if (!j || typeof j.result !== 'string') throw new Error((j && j.error) || 'No page');
        page = j.result;
        if (still) show();
      })
      .catch(function () { msg.textContent = 'Couldn’t reach the server. Check your signal. Trying again…'; msg.className = 'on'; setTimeout(load, 4000); });
  }
  load();
  play().then(function () { if (still && page !== null) show(); });
})();
</script>
</body>
</html>
