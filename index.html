<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WMR FIS Men</title>
<meta name="apple-mobile-web-app-title" content="WMR FIS Men">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#121011">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
html, body { margin: 0; height: 100%; background: #121011; color: #a8a09e; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; box-sizing: border-box; }
img { width: 96px; height: 96px; border-radius: 22px; }
</style>
</head>
<body>
<img src="apple-touch-icon.png" alt="">
<p id="msg">Loading…</p>
<script>
/* WMR FIS Men: this page only loads the app from the WMR Apps Script server and shows it here.
   The app, the data and the logins all live on that server; nothing else is stored in this repository. */
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbxUyS4z_Q2362NvduPf-RM2RfoyS0f8AtL_WJxWv69Dj7ISU9EX20sceVLxL-raGEXT/exec';
  var msg = document.getElementById('msg');
  function load() {
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'sitePage', args: [] }) })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) {
        if (!j || typeof j.result !== 'string') throw new Error((j && j.error) || 'No page');
        window.__WMR_API = API;
        document.open(); document.write(j.result); document.close();
      })
      .catch(function () { msg.textContent = 'Couldn’t reach the server. Check your signal. Trying again…'; setTimeout(load, 4000); });
  }
  load();
})();
</script>
</body>
</html>
